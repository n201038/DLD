<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Digital Logic — Visualizer</title>
  <style>
    :root{--bg:#f6f7fb;--card:#ffffff;--muted:#6b7280;--accent:#0070f3;--good:#16a34a;--glass:rgba(255,255,255,0.65)}
    html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:linear-gradient(180deg,#f6f7fb,#eef2ff)}
    .nav{display:flex;align-items:center;justify-content:space-between;padding:20px 36px;background:transparent}
    .brand{display:flex;align-items:center;gap:14px}
    .logo{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#00b4ff);box-shadow:0 6px 18px rgba(2,6,23,0.08)}
    h1{font-size:16px;margin:0;color:#0f172a;font-weight:600}
    .toolbar{display:flex;gap:10px;align-items:center}
    .btn{background:transparent;border:0;padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--accent);font-weight:600}

    .wrap{max-width:1180px;margin:22px auto;padding:20px;display:grid;grid-template-columns:1fr 420px;gap:20px}
    .card{background:var(--card);border-radius:14px;padding:18px;box-shadow:0 6px 30px rgba(13,17,30,0.04);border:1px solid rgba(15,23,42,0.03)}
    label{display:block;color:var(--muted);font-size:13px;margin-bottom:8px}
    select,input{width:100%;padding:10px;border-radius:10px;border:1px solid #eef2ff;background:#fbfdff}

    /* Truth table */
    .tt{overflow:auto;border-radius:10px;padding:8px;background:linear-gradient(180deg,#ffffff,#fbfdff)}
    .row{display:flex}
    .cell{min-width:56px;padding:8px 10px;border:1px solid rgba(15,23,42,0.04);text-align:center;font-family:Menlo,Consolas,monospace}
    .cell.btn{cursor:pointer;background:transparent;border:0}

    .kmap{display:grid;gap:8px;margin-top:14px}
      /* Chatbot styles */
      .chat-card{ margin-top:18px; padding:14px; background:linear-gradient(180deg, rgba(250,250,250,0.9), white); border-radius:10px; box-shadow:0 6px 18px rgba(0,0,0,0.06); }
      .chat-messages{ max-height:220px; overflow:auto; border:1px solid #eee; padding:8px; border-radius:6px; background:#fff; }
      .chat-msg{ padding:8px 10px; margin:6px 0; border-radius:8px; font-size:13px; }
      .chat-msg.bot{ background:#f1f6ff; color:#0b3a8c; }
      .chat-msg.user{ background:#f5f5f5; color:#111; text-align:right; }
      .chat-input-row{ display:flex; gap:8px; margin-top:8px; }
      .chat-input-row textarea{ flex:1; min-height:56px; resize:vertical; padding:8px; border-radius:6px; border:1px solid #ddd; }
      .chat-input-row button{ padding:8px 12px; border-radius:6px; border:none; background:#0b69ff; color:white; cursor:pointer; font-weight:600; }

    .output{background:#fbfdff;padding:12px;border-radius:10px;border:1px solid rgba(15,23,42,0.04);font-family:Consolas,monospace;color:#0f172a}

    /* Modals */
    .modal-backdrop{position:fixed;inset:0;background:rgba(4,6,12,0.35);display:none;align-items:center;justify-content:center;z-index:1000}
    .modal{width:880px;max-width:95%;max-height:85vh;border-radius:12px;padding:18px;background:linear-gradient(180deg,#fff,#fbfdff);box-shadow:0 30px 80px rgba(2,6,23,0.3);display:flex;flex-direction:column;overflow:hidden}
    .modal.fullscreen{width:98vw;height:96vh;max-width:98vw;max-height:96vh;border-radius:0}
    .modal.fullscreen svg, .modal.fullscreen canvas{width:100%;height:100%;}
    .modal-content{flex:1;overflow:auto}
    .fs-btn{background:#f3f4f6;color:#0f172a;padding:8px 10px;border-radius:6px;border:1px solid #e5e7eb;cursor:pointer;font-size:12px;font-weight:600;}
    .fs-btn:hover{background:#e5e7eb}

    footer{max-width:1180px;margin:18px auto;color:var(--muted);font-size:13px;text-align:center}

    @media(max-width:980px){.wrap{grid-template-columns:1fr}.toolbar{flex-wrap:wrap}}
  </style>
</head>
<body>
  <nav class="nav">
    <div class="brand"><div class="logo" aria-hidden></div><div><h1>Digital Logic</h1><div style="color:var(--muted);font-size:13px">Analyzer & Visualizer</div></div></div>
    <div class="toolbar">
      <button class="btn" id="waveBtn">Timing Waveforms</button>
      <button class="btn" id="schematicBtn">Circuit Schematic</button>
      <button class="btn" id="toolsBtn">Tools ▾</button>
    </div>
  </nav>

  <main class="wrap">
    <section>
      <div class="card">
        <h3 style="margin:0 0 10px 0">Setup Variables</h3>
        <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
          <input id="manualNumVars" type="number" min="2" max="10" value="3" title="Number of variables (2-10)" style="width:60px;padding:8px;border-radius:8px">
          <input id="manualVarNames" type="text" value="A, B, C" placeholder="e.g. A, B, C" style="flex:1;padding:8px;border-radius:8px">
        </div>
        <div id="varErrorMsg" style="color:#ef4444;font-size:12px;margin-bottom:8px;display:none">Error message here</div>
        <button id="buildTableBtn" class="btn" style="padding:8px 12px;background:#0070f3;color:#fff;border-radius:8px;width:100%;border:0;cursor:pointer">Build Truth Table & K-Map</button>

        <div class="tables" style="display:flex;gap:12px;align-items:flex-start">
          <div style="flex:1;min-width:320px">
            <h3 style="margin-top:14px;margin-bottom:8px">Truth Table</h3>
            <div id="ttContainer" class="tt" style="max-height:520px;overflow:auto"></div>
          </div>
          <div style="width:420px;flex-shrink:0">
            <h3 style="margin-top:14px;margin-bottom:8px">Karnaugh Map</h3>
            <div id="kmapContainer" class="kmap" style="max-height:520px;overflow:auto"></div>
          </div>
        </div>
      </div>

      <div class="card" style="margin-top:16px">
        <h3 style="margin:0 0 10px 0">Converters</h3>
        <label>Decimal (0-15)</label>
        <input id="convInput" type="number" min="0" max="15" value="5">
        <div id="convResult" class="output" style="margin-top:10px">Result</div>
      </div>
    </section>

    <!-- Chatbot: Explain Circuit Signal Flow -->
    <div class="card chat-card">
      <h3 style="margin:0 0 8px 0">Circuit Analyzer</h3>
      <div id="chatMessages" class="chat-messages"></div>
      <div class="chat-input-row">
        <textarea id="chatInput" placeholder="Ask a question about the circuit"></textarea>
        <button id="chatExplainBtn">Explain</button>
      </div>
    </div>

    <aside>
      <div class="card">
        <h3 style="margin:0 0 10px 0">Simplified Logic</h3>
        <label>Target Logic</label>
        <select id="gateMode"><option value="standard">Standard AND / OR (SOP)</option><option value="nand">NAND-only</option><option value="nor">NOR-only</option><option value="custom">Custom</option></select>
        <div id="customGates" style="display:none;margin-top:10px">
          <label>Gate 1</label>
          <select id="gate1"><option>XOR</option><option>AND</option><option>OR</option></select>
          <label style="margin-top:8px">Gate 2</label>
          <select id="gate2"><option>NOT</option><option>NAND</option><option>XNOR</option></select>
        </div>

        <label style="margin-top:12px">Standard Expression</label>
        <div id="baseOutput" class="output">Y = 0</div>

        <label style="margin-top:12px">Simplified Expression</label>
        <div id="simplifiedOutput" class="output">Y = 0</div>

        <label style="margin-top:12px">Converted Expression</label>
        <div id="convertedOutput" class="output">Y = 0</div>

        <label style="margin-top:12px">Minterms / Maxterms</label>
        <div style="display:flex;gap:8px;margin-top:6px">
          <textarea id="mintermsBox" readonly style="flex:1;min-height:42px;border-radius:8px;padding:8px;border:1px solid #eef2ff;background:#fbfdff"></textarea>
          <textarea id="maxtermsBox" readonly style="width:160px;min-height:42px;border-radius:8px;padding:8px;border:1px solid #eef2ff;background:#fbfdff"></textarea>
        </div>

        <label style="margin-top:12px;display:flex;justify-content:space-between;align-items:center">
          <span>Propagation Delay</span>
          <button id="delaySettingsBtn" style="background:transparent;border:0;cursor:pointer;font-size:16px" title="Customize Gate Delays">⚙️</button>
        </label>
        <div style="display:flex;gap:8px;align-items:center;margin-top:6px">
          <div id="delayOutput" class="output" style="flex:1">Critical Path Delay: 0.00 ns</div>
        </div>
      </div>
    </aside>
  </main>

  <div id="modalBackdrop" class="modal-backdrop"><div class="modal" id="modalContent"></div></div>

  <footer>Built with care • Advanced K-Map, converters, enhanced schematics & timing waveforms</footer>

  <script src="script.js"></script>
</body>
</html>
